name: Mint
description: Build and run the Mint CLI in a GitHub Actions workflow.
author: Jameson Stone
branding:
  icon: tag
  color: yellow
inputs:
  command:
    description: "Mint command to run after the CLI is built. Supported values: version, help, changelog, release-resolve, release-tag, github-release, release-publish, none."
    required: false
    default: version
  go-version:
    description: Go version used to build the Mint CLI from the action source.
    required: false
    default: "1.25.5"
  prev-tag:
    description: Previous Git tag or ref for changelog generation; empty for first release.
    required: false
    default: ""
  current-tag:
    description: Current release tag rendered by changelog generation.
    required: false
    default: ""
  current-ref:
    description: Optional Git ref used as the changelog range end when current-tag does not exist yet.
    required: false
    default: ""
  owner:
    description: GitHub repository owner used for changelog links.
    required: false
    default: ""
  repo:
    description: GitHub repository name used for changelog links.
    required: false
    default: ""
  output:
    description: Changelog output path used by command changelog.
    required: false
    default: CHANGELOG.md
  commitish:
    description: Git ref used by command release-resolve.
    required: false
    default: HEAD
  release-tag:
    description: Strict vX.Y.Z SemVer tag used by command github-release.
    required: false
    default: ""
  target-sha:
    description: Commitish where GitHub should create the release tag when missing.
    required: false
    default: ""
  release-title:
    description: Release title used by command github-release; defaults to release-tag.
    required: false
    default: ""
  release-notes-file:
    description: Optional release notes file used by command release-tag or github-release.
    required: false
    default: ""
  release-remote:
    description: Git remote used by command release-tag or release-publish.
    required: false
    default: origin
  release-push:
    description: Whether command release-tag or release-publish should push a newly created tag.
    required: false
    default: "true"
  github-token:
    description: GitHub token used by command github-release or release-publish.
    required: false
    default: ""
  github-api-url:
    description: GitHub API base URL used by command github-release.
    required: false
    default: https://api.github.com
outputs:
  mint-path:
    description: Absolute path to the built Mint CLI on the runner.
    value: ${{ steps.build.outputs.mint-path }}
  output:
    description: Captured stdout from the selected Mint command.
    value: ${{ steps.run.outputs.output }}
  version_tag:
    description: Resolved SemVer release tag from command release-resolve.
    value: ${{ steps.run.outputs.version_tag }}
  version_bump:
    description: Selected release bump from command release-resolve.
    value: ${{ steps.run.outputs.version_bump }}
  base_tag:
    description: Reachable base SemVer tag from command release-resolve.
    value: ${{ steps.run.outputs.base_tag }}
  target_sha:
    description: Full target commit SHA from command release-resolve.
    value: ${{ steps.run.outputs.target_sha }}
  short_sha:
    description: Twelve-character target commit SHA from command release-resolve.
    value: ${{ steps.run.outputs.short_sha }}
  needs_git_tag:
    description: Whether a new Git SemVer tag should be created by the caller.
    value: ${{ steps.run.outputs.needs_git_tag }}
  commit_count:
    description: Number of commits evaluated by command release-resolve.
    value: ${{ steps.run.outputs.commit_count }}
  release_notes:
    description: Lightweight release notes from command release-resolve.
    value: ${{ steps.run.outputs.release_notes }}
  release_tag:
    description: GitHub Release tag from command github-release or release-publish.
    value: ${{ steps.run.outputs.release_tag }}
  release_url:
    description: GitHub Release URL from command github-release or release-publish.
    value: ${{ steps.run.outputs.release_url }}
  release_created:
    description: Whether command github-release or release-publish created a new GitHub Release.
    value: ${{ steps.run.outputs.release_created }}
  tag_name:
    description: Git tag name from command release-tag or release-publish.
    value: ${{ steps.run.outputs.tag_name }}
  tag_target_sha:
    description: Git tag target SHA from command release-tag or release-publish.
    value: ${{ steps.run.outputs.tag_target_sha }}
  tag_created:
    description: Whether command release-tag or release-publish created a new Git tag.
    value: ${{ steps.run.outputs.tag_created }}
  tag_reused:
    description: Whether command release-tag or release-publish reused an existing Git tag.
    value: ${{ steps.run.outputs.tag_reused }}
  tag_pushed:
    description: Whether command release-tag or release-publish pushed a newly created Git tag.
    value: ${{ steps.run.outputs.tag_pushed }}
runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version }}
        cache: false
    - name: Build Mint CLI
      id: build
      shell: bash
      env:
        MINT_ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail

        mint_dir="$RUNNER_TEMP/mint-action"
        mkdir -p "$mint_dir"

        mint_version="${MINT_ACTION_REF:-dev}"
        case "$mint_version" in
          *[!A-Za-z0-9._+/-]*)
            mint_version="dev"
            ;;
        esac

        cd "$GITHUB_ACTION_PATH"
        go build -ldflags "-X github.com/jamesonstone/mint/pkg/cli.Version=$mint_version" -o "$mint_dir/mint" ./cmd/mint

        echo "$mint_dir" >> "$GITHUB_PATH"
        echo "mint-path=$mint_dir/mint" >> "$GITHUB_OUTPUT"
    - name: Run Mint CLI
      id: run
      shell: bash
      env:
        MINT_COMMAND: ${{ inputs.command }}
        MINT_PATH: ${{ steps.build.outputs.mint-path }}
        MINT_PREV_TAG: ${{ inputs.prev-tag }}
        MINT_CURRENT_TAG: ${{ inputs.current-tag }}
        MINT_CURRENT_REF: ${{ inputs.current-ref }}
        MINT_OWNER: ${{ inputs.owner }}
        MINT_REPO: ${{ inputs.repo }}
        MINT_OUTPUT_FILE: ${{ inputs.output }}
        MINT_COMMITISH: ${{ inputs.commitish }}
        MINT_RELEASE_TAG: ${{ inputs.release-tag }}
        MINT_TARGET_SHA: ${{ inputs.target-sha }}
        MINT_RELEASE_TITLE: ${{ inputs.release-title }}
        MINT_RELEASE_NOTES_FILE: ${{ inputs.release-notes-file }}
        MINT_RELEASE_REMOTE: ${{ inputs.release-remote }}
        MINT_RELEASE_PUSH: ${{ inputs.release-push }}
        MINT_GITHUB_TOKEN_INPUT: ${{ inputs.github-token }}
        MINT_GITHUB_CONTEXT_TOKEN: ${{ github.token }}
        MINT_GITHUB_API_URL: ${{ inputs.github-api-url }}
      run: |
        set -euo pipefail

        release_output="$RUNNER_TEMP/mint-release-output"
        rm -f "$release_output"

        if [ -n "$MINT_GITHUB_TOKEN_INPUT" ]; then
          export MINT_GITHUB_TOKEN="$MINT_GITHUB_TOKEN_INPUT"
        elif [ -n "$MINT_GITHUB_CONTEXT_TOKEN" ]; then
          export MINT_GITHUB_TOKEN="$MINT_GITHUB_CONTEXT_TOKEN"
        fi

        case "$MINT_COMMAND" in
          version)
            output="$("$MINT_PATH" version)"
            ;;
          help)
            output="$("$MINT_PATH" --help)"
            ;;
          changelog)
            output="$("$MINT_PATH" --prev-tag "$MINT_PREV_TAG" --current-tag "$MINT_CURRENT_TAG" --current-ref "$MINT_CURRENT_REF" --owner "$MINT_OWNER" --repo "$MINT_REPO" --output "$MINT_OUTPUT_FILE")"
            ;;
          release-resolve)
            output="$("$MINT_PATH" release resolve --commitish "$MINT_COMMITISH" --github-output "$release_output")"
            cat "$release_output" >> "$GITHUB_OUTPUT"
            ;;
          release-tag)
            output="$("$MINT_PATH" release tag --tag "$MINT_RELEASE_TAG" --target "$MINT_TARGET_SHA" --notes-file "$MINT_RELEASE_NOTES_FILE" --remote "$MINT_RELEASE_REMOTE" --push="$MINT_RELEASE_PUSH" --github-output "$release_output")"
            cat "$release_output" >> "$GITHUB_OUTPUT"
            ;;
          github-release)
            output="$("$MINT_PATH" release github --owner "$MINT_OWNER" --repo "$MINT_REPO" --tag "$MINT_RELEASE_TAG" --target "$MINT_TARGET_SHA" --title "$MINT_RELEASE_TITLE" --notes-file "$MINT_RELEASE_NOTES_FILE" --api-url "$MINT_GITHUB_API_URL" --github-output "$release_output")"
            cat "$release_output" >> "$GITHUB_OUTPUT"
            ;;
          release-publish)
            output="$("$MINT_PATH" release publish --commitish "$MINT_COMMITISH" --owner "$MINT_OWNER" --repo "$MINT_REPO" --title "$MINT_RELEASE_TITLE" --remote "$MINT_RELEASE_REMOTE" --push="$MINT_RELEASE_PUSH" --api-url "$MINT_GITHUB_API_URL" --github-output "$release_output")"
            cat "$release_output" >> "$GITHUB_OUTPUT"
            ;;
          none)
            output=""
            ;;
          *)
            echo "::error::Unsupported mint action command '$MINT_COMMAND'. Supported values: version, help, changelog, release-resolve, release-tag, github-release, release-publish, none."
            exit 2
            ;;
        esac

        if [ -n "$output" ]; then
          printf '%s\n' "$output"
        fi

        {
          echo "output<<MINT_OUTPUT"
          printf '%s\n' "$output"
          echo "MINT_OUTPUT"
        } >> "$GITHUB_OUTPUT"
